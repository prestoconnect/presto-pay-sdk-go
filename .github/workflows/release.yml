name: Release

# Push a tag like v0.1.0 that has a matching section in CHANGELOG.md.
on:
  push:
    tags: ["v*"]

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create the GitHub release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; found = ($2 == v || $2 == "[" v "]"); next }
            found && !/^\[[^]]+\]: / { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists"
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "Go SDK ${GITHUB_REF_NAME}" --notes-file notes.md
